<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121519">
  <title>بوابة الطالب | حزب مستقبل وطن</title>
  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg">

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Modular Design System Styles -->
  <link rel="stylesheet" href="../src/styles/variables.css">
  <link rel="stylesheet" href="../src/styles/reset.css">
  <link rel="stylesheet" href="../src/styles/globals.css">
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/layouts.css">
  <link rel="stylesheet" href="../src/styles/utilities.css">
</head>
<body>

  <!-- Root Mount Node -->
  <div id="appRoot">
    <div class="text-center" style="padding: 5rem 1rem;">
      <div class="spinner"></div>
      <p class="text-muted mt-2">جاري التحقق من الحساب وتحميل المنصة... 🚀</p>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container"></div>

  <!-- Application Bootstrap & Controller Wiring -->
  <script type="module">
    import { Router } from "../src/app/router.js";
    import { ROLES } from "../src/core/constants.js";
    import { mountStudentLayout } from "../src/shared/layouts/StudentLayout/student-layout.component.js";
    import { renderVideoPlayerModal } from "../src/features/lectures/components/video-player-modal.component.js";
    import { StudentsService } from "../src/features/students/students.service.js";
    import { LecturesController } from "../src/features/lectures/lectures.controller.js";
    import { ExamController } from "../src/features/exams/exam.controller.js";
    import { AssignmentController } from "../src/features/assignments/assignment.controller.js";
    import { AttendanceController } from "../src/features/attendance/attendance.controller.js";
    import { ProfileController } from "../src/features/profile/profile.controller.js";
    import { AuthController } from "../src/features/auth/auth.controller.js";
    import { bootstrapApp } from "../src/app/bootstrap.js";

    bootstrapApp();

    try {
      // 1. Enforce Role Protection
      const { user } = await Router.guard(ROLES.STUDENT);

      // 2. Fetch Student Profile with Direct O(1) & Scoped Fallback
      let student = await StudentsService.getStudentProfile(user.uid);
      if (!student) {
        const phone = (user.email || "").split("@")[0];
        student = await StudentsService.getStudentByPhone(phone);
      }
      if (!student) {
        student = {
          id: user.uid,
          firestoreId: user.uid,
          studentName: "طالب مسجل",
          studentPhone: (user.email || "").split("@")[0],
          studentGroup: "ALL"
        };
      }

      // 3. Mount UI Layout Shell
      const root = document.getElementById("appRoot");
      const layout = mountStudentLayout(root, {
        onLogout: () => AuthController.logout(),
        onTabChange: (tabId) => {
          if (tabId === "videos") {
            LecturesController.loadStudentLectures("videoListContainer", student);
          } else if (tabId === "exams") {
            ExamController.loadStudentExams("examListContainer", student);
          } else if (tabId === "tasks") {
            AssignmentController.loadStudentAssignments("taskListContainer", student);
          } else if (tabId === "attendance") {
            AttendanceController.loadStudentAttendance("attendanceContainer", student);
          } else if (tabId === "profile") {
            ProfileController.loadProfileView("profileContainer", student);
          } else if (tabId === "settings") {
            ProfileController.loadSettingsView("settingsContainer");
          }
        }
      });

      layout.updateProfile({
        name: student.studentName || student.name,
        phone: student.studentPhone || student.phone
      });

      // 4. Mount Video Player Modal into DOM
      document.body.insertAdjacentHTML("beforeend", renderVideoPlayerModal());

      // 5. Initial Tab Activation
      LecturesController.loadStudentLectures("videoListContainer", student);

    } catch (err) {
      console.error("Student page initialization error:", err);
    }
  </script>
</body>
</html>
