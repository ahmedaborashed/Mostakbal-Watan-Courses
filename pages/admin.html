<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="cyan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121519">
  <title>لوحة الإدارة العامة | حزب مستقبل وطن</title>
  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg">

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Modular Design System Styles -->
  <link rel="stylesheet" href="../src/styles/variables.css">
  <link rel="stylesheet" href="../src/styles/reset.css">
  <link rel="stylesheet" href="../src/styles/globals.css">
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/layouts.css">
  <link rel="stylesheet" href="../src/styles/utilities.css">
</head>
<body>

  <!-- Root Mount Node -->
  <div id="appRoot">
    <div class="portal-initial-loader">
      <div class="portal-loader-card">
        <div class="portal-loader-emblem-wrap">
          <div class="portal-loader-ring" aria-hidden="true"></div>
          <img src="../assets/images/logo.jpeg" alt="شعار المنصة" class="portal-loader-logo">
        </div>
        <h3 class="portal-loader-title">مستقبل وطن - لوحة الإدارة</h3>
        <div class="portal-loader-status">
          <span class="splash-pulse-dot" aria-hidden="true"></span>
          <span>جاري التحقق من صلاحيات الإدارة وفتح النظام... 🔐</span>
        </div>
        <div class="portal-loader-progress" aria-hidden="true">
          <div class="portal-loader-progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container"></div>

  <!-- Application Bootstrap & Controller Wiring -->
  <script type="module">
    import { Router } from "../src/app/router.js";
    import { ROLES } from "../src/core/constants.js";
    import { mountAdminLayout } from "../src/shared/layouts/AdminLayout/admin-layout.component.js";
    import { StudentsController } from "../src/features/students/students.controller.js";
    import { AttendanceController } from "../src/features/attendance/attendance.controller.js";
    import { ExamController } from "../src/features/exams/exam.controller.js";
    import { ProfileController } from "../src/features/profile/profile.controller.js";
    import { AuthController } from "../src/features/auth/auth.controller.js";
    import { bootstrapApp } from "../src/app/bootstrap.js";

    bootstrapApp();

    try {
      // 1. Enforce Admin Security
      const { user } = await Router.guard(ROLES.ADMIN);

      // 2. Mount Admin Layout
      const root = document.getElementById("appRoot");
      const layout = mountAdminLayout(root, {
        onLogout: () => AuthController.logout(),
        onTabChange: (tabId) => {
          if (tabId === "attendance") {
            AttendanceController.loadTeacherAttendance("adminAttendanceContainer");
          } else if (tabId === "students") {
            StudentsController.loadStudentsList("adminStudentsContainer", { canDelete: true });
          } else if (tabId === "exams") {
            ExamController.loadAdminExams("adminExamsContainer");
          } else if (tabId === "settings") {
            ProfileController.loadSettingsView("adminSettingsContainer");
          }
        }
      });

      layout.updateProfile({
        name: "مدير النظام",
        email: user.email || "admin@admin.local"
      });

      // 3. Initial Tab Activation
      AttendanceController.loadTeacherAttendance("adminAttendanceContainer");

    } catch (err) {
      console.error("Admin page initialization error:", err);
    }
  </script>
</body>
</html>
