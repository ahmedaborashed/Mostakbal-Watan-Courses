<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostakbal Watan Courses</title>

  <script>
    const path = window.location.pathname;

    if (path.endsWith("/teacher") || path.endsWith("/teacher.html")) {
      window.location.replace(
        "/Mostakbal-Watan-Courses/pages/teacher.html" +
        window.location.search +
        window.location.hash
      );
    }
    else if (path.endsWith("/student") || path.endsWith("/student.html")) {
      window.location.replace(
        "/Mostakbal-Watan-Courses/pages/student.html" +
        window.location.search +
        window.location.hash
      );
    }
    else if (path.endsWith("/admin") || path.endsWith("/admin.html")) {
      window.location.replace(
        "/Mostakbal-Watan-Courses/pages/admin.html" +
        window.location.search +
        window.location.hash
      );
    }
    else {
      window.location.replace("/Mostakbal-Watan-Courses/");
    }
  </script>
</head>
<body>
</body>
</html>
