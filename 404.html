<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostakbal Watan</title>

  <script>
    const path = window.location.pathname;

    if (path.endsWith("/teacher")) {
      window.location.replace(
        "/Mostakbal-Watan-Courses/teacher.html" +
        window.location.search +
        window.location.hash
      );
    }

    else if (path.endsWith("/student")) {
      window.location.replace(
        "/Mostakbal-Watan-Courses/student.html" +
        window.location.search +
        window.location.hash
      );
    }

    else if (path.endsWith("/admin")) {
      window.location.replace(
        "/Mostakbal-Watan-Courses/admin.html" +
        window.location.search +
        window.location.hash
      );
    }

    else {
      window.location.replace("/Mostakbal-Watan-Courses/");
    }
  </script>
</head>

<body>
</body>
</html>
